name: Go
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
  merge_group:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
      id: go
    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    - name: unit-test
      run: go test -v ./... -coverprofile cover.out
    - uses: codecov/codecov-action@v7
      with:
        disable_search: true
        files: cover.out
        token: ${{ secrets.CODECOV_TOKEN }}

  go-apidiff:
    name: go-apidiff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
      id: go
    - name: Print out Go env
      run: go env
    - name: Run go-apidiff
      uses: joelanford/go-apidiff@main
      id: check-api
      continue-on-error: true
    - name: Check for override label
      if: ${{ steps.check-api.outcome == 'failure' }}
      run: |
        if gh api repos/$OWNER/$REPO/pulls/$PR --jq '.labels.[].name' | grep -q "${OVERRIDE_LABEL}"; then
          echo "Found ${OVERRIDE_LABEL} label, overriding failed results."
          exit 0
        else
          echo "No ${OVERRIDE_LABEL} label found, failing the job."
          exit 1
        fi
      env:
        GH_TOKEN: ${{ github.token }}
        OWNER: ${{ github.repository_owner }}
        REPO: ${{ github.event.repository.name }}
        PR: ${{ github.event.pull_request.number }}
        OVERRIDE_LABEL: "go-apidiff-override"
